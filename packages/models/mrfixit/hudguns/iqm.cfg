iqmdir "mrfixit/hudguns" 
iqmload "ranger_hands.iqm" skeletal
if (>= (strstr (mdlname) "blue") 0) [
    iqmskin * "<dds>skin.png"  "<dds>skin_mask.png" 0 0.1
] [
    if (>= (strstr (mdlname) "red") 0) [
        iqmskin * "<dds>skin.png"  "<dds>skin_mask.png" 0 0.1
    ] [
        iqmskin * "<dds>skin.png"  "<dds>skin_mask.png" 0 0.1
    ]
]
iqmbumpmap * "<dds>skin_normals.png"
iqmspec 0.1
iqmglare 0.5 0
